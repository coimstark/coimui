name: Publish @coimui/svelte

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  publish:
    name: Publish @coimui/svelte (OIDC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag, main ancestry & registry uniqueness
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a strict vX.Y.Z semver release tag."
            exit 1
          fi
          VERSION="$(node -p "require('./packages/coimui/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          node -e '
            const lib = require("./packages/coimui/package.json");
            const starter = require("./apps/starter/package.json");
            const showcase = require("./apps/showcase/package.json");
            if (lib.name !== "@coimui/svelte") throw new Error("Unexpected library name: " + lib.name);
            if (lib.private === true) throw new Error("packages/coimui must not be private");
            if (lib.publishConfig?.access !== "public") throw new Error("publishConfig.access must be public");
            if (starter.private !== true) throw new Error("apps/starter must remain private");
            if (showcase.private !== true) throw new Error("apps/showcase must remain private");
          '
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if npm view "@coimui/svelte@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@coimui/svelte@${VERSION} is already published on npm."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Ensure OIDC-capable npm CLI (>= 11.5.1)
        run: |
          npm install -g npm@12.2.3
          NPM_VER="$(npm --version)"
          echo "npm CLI version: ${NPM_VER}"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) throw new Error("npm >= 11.5.1 required, got " + process.argv[1]);
          ' "${NPM_VER}"

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build @coimui/svelte distributable package
        run: bun run package

      - name: Verify package metadata, exports & tarball integrity
        run: bun run verify:package

      - name: Publish @coimui/svelte via npm Trusted Publishing (OIDC)
        working-directory: packages/coimui
        run: npm publish --access public --provenance

      - name: Verify published package & provenance on npm registry
        run: |
          VERSION="$(node -p "require('./packages/coimui/package.json').version")"
          for i in $(seq 1 12); do
            if npm view "@coimui/svelte@${VERSION}" version dist-tags repository.url --json; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published package @coimui/svelte@${VERSION} did not appear within 60s."
          exit 1
