name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck, Unit & Package Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run Svelte & SvelteKit checks
        run: bun run check

      - name: Run TypeScript 7 typecheck
        run: bun run typecheck:ts7

      - name: Run unit & SSR tests
        run: bun run test:unit

      - name: Build library and workspace applications
        run: bun run build

      - name: Verify distributable package & tarball integrity
        run: bun run verify:package

  e2e-visual:
    name: Browser E2E, Accessibility & Visual Baselines
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install unzip for Bun archive extraction
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build library and workspace applications
        run: bun run build

      - name: Run Playwright parity, WCAG & visual baseline suite
        run: bun run test:parity

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
